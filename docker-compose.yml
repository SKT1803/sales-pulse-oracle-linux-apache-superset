services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salespulse-backend
    env_file: .env.docker
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  client:
    build:
      context: . # kök; deploy/nginx.conf erişsin
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api # Nginx proxy ile eşleşir
    container_name: salespulse-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
